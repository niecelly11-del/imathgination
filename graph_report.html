<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph Report | iMATHgination</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b8e23;
      --primary-dark: #4c6a1a;
      --bg: #dfe6cf;
      --bg-card: #b6c28f;
      --bg-frame: #8fa36b;
      --text: #2b2b2b;
      --accent: #e6e3cc;
      --font-main: "Inter", sans-serif;
      --font-soft: "Nunito", sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      border: 10px solid var(--bg-frame);
      background-image: linear-gradient(to bottom, #e7edd5 0%, #dfe6cf 100%);
      background-attachment: fixed;
      min-height: 97.4vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: var(--bg-card);
      color: var(--primary-dark);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 1000px;
      border-bottom: 2px solid var(--bg-frame);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0;
      font-family: var(--font-soft);
      font-weight: 700;
      font-size: 1.5rem;
    }

    .back-btn {
      position: absolute;
      right: 25px;
      background: var(--accent);
      color: var(--primary-dark);
      border: 1px solid var(--bg-frame);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font-soft);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 40px 20px;
    }

    .modal-container {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 75%;
      background: #fff;
      border-radius: 30px 30px 0 0;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
      transition: bottom 0.4s ease-in-out, opacity 0.4s ease-in-out;
      padding: 25px;
      overflow-y: auto;
      opacity: 0;
    }

    .modal-container.active {
      bottom: 0;
      opacity: 1;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      justify-items: center;
    }

    @media (min-width: 800px) {
      .chart-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .chart-card {
      background: var(--accent);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--bg-frame);
      width: 95%;
      max-width: 400px;
    }

    canvas {
      display: block;
      max-width: 90%;
      height: 180px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      canvas {
        height: 150px;
      }
    }

    .open-modal {
      margin-top: 20px;
      background: var(--primary-dark);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-family: var(--font-soft);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .open-modal:hover {
      background: var(--primary);
    }

    .back-dashboard-btn {
      display: inline-block;
      margin-top: 25px;
      background: var(--primary-dark);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 25px;
      font-family: var(--font-soft);
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .back-dashboard-btn:hover {
      background: var(--primary);
    }
  </style>
</head>

<body>
  <header>
    <h1>Graph Report</h1>
    <button class="back-btn" onclick="goBack()">Back to Reports</button>
  </header>

  <main>
    <h2 id="studentName">Loading Student Data...</h2>
    <button class="open-modal" id="openModalBtn">📊 View Performance Graphs</button>
  </main>

  <div class="modal-container" id="graphModal">
    <div class="chart-grid">
      <div class="chart-card">
        <h3>📈 Student Progress</h3>
        <canvas id="studentChart"></canvas>
      </div>

      <div class="chart-card">
        <h3>🏫 Section Average Comparison</h3>
        <canvas id="sectionChart"></canvas>
      </div>
    </div>

    <button class="back-dashboard-btn" onclick="closeModal()">⬅️ Back to Graph Dashboard</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADVdmyzhrewkr2-AjV15NwdAqrfhw2TaY",
      authDomain: "imathgination-7e610.firebaseapp.com",
      projectId: "imathgination-7e610",
      storageBucket: "imathgination-7e610.appspot.com",
      messagingSenderId: "591589679937",
      appId: "1:591589679937:web:5298f062812021e64c77c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const topics = {
      timelessVillage: "Time and World Zones (Timeless Village)",
      gmdasOperations: "GMDAS Operations (Operation Forest)",
      multiplyingFractions: "Multiplying Fractions (Fraction River)",
      areaOfShapes: "Area of Shapes (Tri Trap Par Cave)"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get("id");
    const topicKey = urlParams.get("topic");
    const topicLabel = topics[topicKey] || "Topic";

    const modal = document.getElementById("graphModal");
    const openModalBtn = document.getElementById("openModalBtn");

    openModalBtn.addEventListener("click", () => {
      modal.classList.add("active");
    });

    window.closeModal = function() {
      modal.style.opacity = "0";
      modal.style.bottom = "-100%";
      setTimeout(() => {
        modal.classList.remove("active");
        modal.removeAttribute("style");
      }, 400);
    };

    async function loadStudentData() {
      if (!studentId) return;

      const studentRef = doc(db, "users", studentId);
      const studentSnap = await getDoc(studentRef);
      if (!studentSnap.exists()) {
        document.getElementById("studentName").textContent = "Student not found.";
        return;
      }

      const student = studentSnap.data();
      const name = `${student.first || ""} ${student.last || ""}`;
      const section = student.section || "Unknown";
      document.getElementById("studentName").textContent = `${name} — ${topicLabel}`;

      const scores = student.scores || {};
      const topicScore = scores[topicKey] || 0;
      const progress = student.progress || {};

      const progressScores = Object.values(progress)
        .filter(p => p.title && p.title.toLowerCase().includes(topicLabel.toLowerCase()))
        .map(p => p.score);

      const minScore = progressScores.length ? Math.min(...progressScores) : topicScore;
      const maxScore = progressScores.length ? Math.max(...progressScores) : topicScore;

      renderStudentChart(minScore, maxScore);

      const q = query(collection(db, "users"), where("role", "==", "student"), where("section", "==", section));
      const snapshot = await getDocs(q);

      const sectionScores = [];
      snapshot.forEach(docSnap => {
        const user = docSnap.data();
        if (user.scores && user.scores[topicKey] !== undefined) {
          sectionScores.push(user.scores[topicKey]);
        }
      });

      const sectionAvg = sectionScores.length
        ? sectionScores.reduce((a, b) => a + b, 0) / sectionScores.length
        : topicScore;

      renderSectionChart(topicScore, sectionAvg);
    }

    function renderStudentChart(minScore, maxScore) {
      const ctx = document.getElementById("studentChart").getContext("2d");
      new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Lowest Score", "Highest Score"],
          datasets: [{
            label: "Score",
            data: [minScore, maxScore],
            backgroundColor: ["#c7d6a2", "#6b8e23"]
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true, max: 100 } }
        }
      });
    }

    function renderSectionChart(studentScore, sectionAvg) {
      const ctx = document.getElementById("sectionChart").getContext("2d");
      new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Student", "Section Average"],
          datasets: [{
            label: "Scores",
            data: [studentScore, sectionAvg],
            backgroundColor: ["#6b8e23", "#a3c072"]
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true, max: 100 } }
        }
      });
    }

    window.goBack = function () {
      window.location.href = "data_reports.html";
    };

    loadStudentData();
  </script>
</body>
</html>
