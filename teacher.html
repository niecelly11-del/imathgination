<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard | iMATHgination</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6b8e23;
      --primary-dark: #4c6a1a;
      --bg: #dfe6cf;
      --bg-card: #b6c28f;
      --bg-frame: #8fa36b;
      --text: #2b2b2b;
      --accent: #e6e3cc;
      --font-main: "Inter", sans-serif;
      --font-soft: "Nunito", sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      margin: 0;
      padding: 0;
      color: var(--text);
      border: 10px solid var(--bg-frame);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      min-height: 97.4vh;
    }

    header {
      background: var(--bg-card);
      color: var(--primary-dark);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bg-frame);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      font-family: var(--font-soft);
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: var(--primary-dark);
      border: 1px solid var(--bg-frame);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: var(--font-soft);
    }

    button:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    main {
      flex: 1;
      padding: 40px;
    }

    h2 {
      color: var(--primary-dark);
      font-weight: 700;
      font-family: var(--font-soft);
      text-align: center;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }

    

    .card {
      background: var(--accent);
      border-radius: 16px;
      border: 1px solid var(--bg-frame);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      padding: 24px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      border-color: var(--primary);
    }

    .card h3 {
      margin: 10px 0 5px;
      color: var(--primary-dark);
      font-family: var(--font-soft);
      font-size: 1.15rem;
    }

    .card p {
      color: #3d3226;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    footer {
      background-color: var(--bg-card);
      border-top: 2px solid var(--bg-frame);
      color: #4c4c4c;
      font-size: 0.9rem;
      padding: 1rem;
      text-align: center;
      margin-top: auto;
      font-family: var(--font-soft);
    }

    /* === Modal === */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--accent);
      padding: 30px;
      border-radius: 14px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      text-align: center;
      overflow-y: auto;
      max-height: 80vh;
      opacity: 0;
      transform: translateY(-50px);
      animation: slideDown 0.35s forwards;
    }

    @keyframes slideDown {
      to { opacity: 1; transform: translateY(0); }
    }

    .logout-btn {
      margin: 10px;
      padding: 8px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font-soft);
      transition: all 0.2s ease;
    }

    .logout-yes { background: var(--primary); color: #fff; }
    .logout-yes:hover { background: var(--primary-dark); }
    .logout-cancel { background: var(--bg-card); color: var(--primary-dark); }
    .logout-cancel:hover { background: #999; }
  </style>
</head>

<body>
  <header>
    <h1>Teacher Dashboard</h1>
    <div class="header-buttons">
      <button onclick="openPasswordModal()">Update Password</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <h2 id="welcomeMessage">Welcome, Teacher!</h2>

    <div class="card-container">
      <div class="card" onclick="openModule('data_reports.html')">
        <h3>Data Reports</h3>
        <p>View student scores and performance analytics.</p>
      </div>

      <div class="card" onclick="openModule('assessment_module.html')">
        <h3>Assessment Module</h3>
        <p>Create and manage quizzes and assessments.</p>
      </div>
    </div>
  </main>
  
  <footer>
    <p>© 2025 iMATHgination — Teacher Portal</p>
  </footer>

  <!-- Logout Modal -->
  <div class="modal" id="logoutModal">
    <div class="modal-content">
      <h3>Are you sure you want to logout?</h3>
      <div>
        <button class="logout-btn logout-yes" onclick="confirmLogout()">Yes, Logout</button>
        <button class="logout-btn logout-cancel" onclick="closeLogoutModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <h3>Update Password</h3>
      <div style="margin-top: 15px;">
        <input type="password" id="currentPassword" placeholder="Current Password" style="margin-bottom:10px; width:80%; padding:8px;"><br>
        <input type="password" id="newPassword" placeholder="New Password" style="margin-bottom:10px; width:80%; padding:8px;"><br>
        <input type="password" id="confirmPassword" placeholder="Confirm New Password" style="margin-bottom:15px; width:80%; padding:8px;"><br>
        <button class="logout-btn logout-yes" onclick="updatePassword()">Update</button>
        <button class="logout-btn logout-cancel" onclick="closePasswordModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADVdmyzhrewkr2-AjV15NwdAqrfhw2TaY",
      authDomain: "imathgination-7e610.firebaseapp.com",
      projectId: "imathgination-7e610",
      storageBucket: "imathgination-7e610.appspot.com",
      messagingSenderId: "591589679937",
      appId: "1:591589679937:web:5298f062812021e64c77c0",
      measurementId: "G-NQBJ952VLG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- SESSION VALIDATION ---
    const session = JSON.parse(localStorage.getItem("session"));
    if (!session || session.role !== "teacher") {
      alert("Please log in as a teacher first.");
      window.location.href = "imathgination.html";
    } else {
      // Re-check active flag from Firestore (in case admin deactivated account)
      (async function validateActive() {
        try {
          const q = query(collection(db, "users"), where("number", "==", session.number));
          const snap = await getDocs(q);
          if (snap.empty) {
            alert("Teacher record not found. Please log in again.");
            localStorage.removeItem('session');
            window.location.href = 'imathgination.html';
            return;
          }
          const data = snap.docs[0].data();
          if (data.active === false) {
            alert('Your account has been deactivated. Contact the administrator.');
            localStorage.removeItem('session');
            window.location.href = 'imathgination.html';
            return;
          }
          const first = session.first || "";
          const mi = session.mi ? ` ${session.mi}.` : "";
          const last = session.last || "";
          document.getElementById("welcomeMessage").textContent = `Welcome, Teacher ${first} ${last}!`;
        } catch (err) {
          console.warn('Session validation failed', err);
          // allow to continue but safe fallback
          const first = session.first || "";
          const last = session.last || "";
          document.getElementById("welcomeMessage").textContent = `Welcome, Teacher ${first} ${last}!`;
        }
      })();

      
    }

    // --- LOGOUT ---
    window.openModule = (page) => window.location.href = page;
    window.logout = () => document.getElementById("logoutModal").style.display = "flex";
    window.closeLogoutModal = () => document.getElementById("logoutModal").style.display = "none";
    window.confirmLogout = () => {
      localStorage.removeItem("session");
      window.location.href = "imathgination.html";
    };

    // --- PASSWORD MODAL ---
    window.openPasswordModal = () => document.getElementById("passwordModal").style.display = "flex";
    window.closePasswordModal = () => document.getElementById("passwordModal").style.display = "none";

    // --- FIXED UPDATE PASSWORD ---
    window.updatePassword = async () => {
      const current = document.getElementById("currentPassword").value.trim();
      const newPass = document.getElementById("newPassword").value.trim();
      const confirmPass = document.getElementById("confirmPassword").value.trim();

      if (!current || !newPass || !confirmPass) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        // ✅ Search for teacher document by "number"
        const q = query(collection(db, "users"), where("number", "==", session.number));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          alert("Teacher record not found in Firestore.");
          return;
        }

        const teacherDoc = querySnapshot.docs[0];
        const teacherData = teacherDoc.data();

        if (current !== teacherData.password) {
          alert("Current password is incorrect.");
          return;
        }

        if (newPass !== confirmPass) {
          alert("New passwords do not match.");
          return;
        }

        //Update password in Firestore
        await updateDoc(teacherDoc.ref, { password: newPass });

        //Update local session
        session.password = newPass;
        localStorage.setItem("session", JSON.stringify(session));

        alert("Password updated successfully!");
        closePasswordModal();
      } catch (err) {
        console.error("Error updating password:", err);
        alert("Failed to update password. Please try again.");
      }
    };
  </script>
</body>
</html>
