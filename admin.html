<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | iMATHgination</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6b8e23;        
      --primary-dark: #4c6a1a;   
      --bg: #dfe6cf;            
      --bg-card: #b6c28f;        
      --bg-frame: #8fa36b;      
      --text: #2b2b2b;           
      --accent: #e6e3cc;        
      --font-main: "Inter", sans-serif;
      --font-soft: "Nunito", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      background-image: linear-gradient(to bottom, #e7edd5 0%, #dfe6cf 100%);
      background-attachment: fixed;
      color: var(--text);
      margin: 0;
      border: 10px solid var(--bg-frame);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.15);
      flex: 1;
    }

    header {
      background: var(--bg-card);
      color: var(--primary-dark);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bg-frame);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      font-family: var(--font-soft);
      letter-spacing: 0.5px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: var(--primary-dark);
      border: 1px solid var(--bg-frame);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: var(--font-soft);
    }

    button:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    main {
      flex: 1;
      padding: 40px;
    }

    h2 {
      color: var(--primary-dark);
      font-weight: 700;
      font-family: var(--font-soft);
      text-align: center;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }

    .card {
      background: var(--accent);
      border-radius: 16px;
      border: 1px solid var(--bg-frame);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      padding: 24px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      border-color: var(--primary);
    }

    .card h3 {
      margin: 10px 0 5px;
      color: var(--primary-dark);
      font-family: var(--font-soft);
      font-size: 1.15rem;
    }

    .card p {
      color: #3d3226;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    footer {
      background-color: var(--bg-card);
      border-top: 2px solid var(--bg-frame);
      color: #4c4c4c;
      font-size: 0.9rem;
      padding: 1.2rem;
      text-align: center;
      margin-top: auto;
      font-family: var(--font-soft);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--accent);
      padding: 30px;
      border-radius: 14px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: var(--primary-dark);
    }

    .modal-content input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid var(--bg-frame);
      border-radius: 8px;
      font-family: var(--font-soft);
    }

    .modal-content button {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Admin Dashboard</h1>
    <div class="header-buttons">
      <button onclick="openPasswordModal()">Change Password</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <h2>Welcome, Admin!</h2>
    <div class="card-container">
      <div class="card" onclick="openModule('admin_user_management.html')">
        <h3>User Management</h3>
        <p>Manage teacher and student accounts — add, deactivate, or delete users.</p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 iMATHgination — Admin Portal</p>
  </footer>

  <!-- Password Modal -->
  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <h3>Update Password</h3>
      <input type="password" id="oldPassword" placeholder="Current Password">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="password" id="confirmPassword" placeholder="Confirm New Password">
      <br>
      <button onclick="updatePassword()">Update</button>
      <button onclick="closePasswordModal()">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADVdmyzhrewkr2-AjV15NwdAqrfhw2TaY",
      authDomain: "imathgination-7e610.firebaseapp.com",
      projectId: "imathgination-7e610",
      storageBucket: "imathgination-7e610.appspot.com",
      messagingSenderId: "591589679937",
      appId: "1:591589679937:web:5298f062812021e64c77c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Open a module page
    window.openModule = function(page) {
      window.location.href = page;
    };

    // Logout: clear session and go to login
    window.logout = function() {
      try { localStorage.removeItem('session'); } catch(e) {}
      try { sessionStorage.clear(); } catch(e) {}
      window.location.href = 'imathgination.html';
    };

    window.openPasswordModal = function() {
      document.getElementById('passwordModal').style.display = 'flex';
    };

    window.closePasswordModal = function() {
      document.getElementById('passwordModal').style.display = 'none';
    };

    // Update password: validate against logged-in user in Firestore when available
    window.updatePassword = async function() {
      const oldPass = document.getElementById('oldPassword').value.trim();
      const newPass = document.getElementById('newPassword').value.trim();
      const confirmPass = document.getElementById('confirmPassword').value.trim();

      if (!oldPass || !newPass || !confirmPass) {
        alert('Please fill in all fields.');
        return;
      }
      if (newPass !== confirmPass) {
        alert('New passwords do not match.');
        return;
      }

      // Try to use logged-in session (set by imathgination.html)
      const session = JSON.parse(localStorage.getItem('session') || 'null');

      try {
        if (session && (session.email || session.number)) {
          const usersRef = collection(db, 'users');
          let q;
          if (session.email) {
            q = query(usersRef, where('email', '==', session.email), where('password', '==', oldPass));
          } else {
            q = query(usersRef, where('number', '==', session.number), where('password', '==', oldPass));
          }
          const snap = await getDocs(q);
          if (snap.empty) {
            alert('Incorrect current password.');
            return;
          }
          const docSnap = snap.docs[0];
          await updateDoc(doc(db, 'users', docSnap.id), { password: newPass });
        } else {
          // Fallback: legacy local admin password stored in localStorage
          const currentPass = localStorage.getItem('adminPassword') || '';
          if (oldPass !== currentPass) { alert('Incorrect current password.'); return; }
          localStorage.setItem('adminPassword', newPass);
        }

        alert('Password updated successfully!');
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        closePasswordModal();
      } catch (err) {
        console.error('Update password error:', err);
        alert('Failed to update password: ' + (err && err.message ? err.message : String(err)));
      }
    };
  </script>
</body>
</html>
