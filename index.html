<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>iMATHgination Adventure</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: "Nunito", sans-serif;
    }
    #gameCanvas {
      display: block;
      margin: auto;
      background: url("data/MainRoom.png") no-repeat center/cover;
      width: 800px;
      height: 600px;
      position: relative;
      border: 4px solid #4a6b16;
      border-radius: 10px;
    }
    #player {
      position: absolute;
      width: 64px;
      height: 64px;
      left: 368px;
      top: 400px;
      transition: left 0.1s, top 0.1s;
      z-index: 5;
    }
    .npc {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #8fa36b;
      border: 2px solid #fff;
      border-radius: 50%;
      text-align: center;
      line-height: 60px;
      font-weight: bold;
      color: black;
    }
    #dialogueBox {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 90%;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 10px;
      display: none;
      font-size: 18px;
      line-height: 1.5;
      border: 2px solid #4a6b16;
    }
    #pressKeyHint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 8px;
      display: none;
      font-size: 16px;
      border: 1px solid #4a6b16;
    }
    #fadeOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      pointer-events: none;
      z-index: 9;
    }
    #quizContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 20;
    }
    #quizContainer button {
      background: #4a6b16;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="gameCanvas">
    <img id="player" src="data/player-01.png" alt="Player" />
    <div id="pressKeyHint">Press [E] to talk</div>
    <div id="dialogueBox"></div>
    <div id="quizContainer"></div>
  </div>
  <div id="fadeOverlay"></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  // 🔥 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyADVdmyzhrewkr2-AjV15NwdAqrfhw2TaY",
    authDomain: "imathgination-7e610.firebaseapp.com",
    projectId: "imathgination-7e610",
    storageBucket: "imathgination-7e610.appspot.com",
    messagingSenderId: "591589679937",
    appId: "1:591589679937:web:5298f062812021e64c77c0"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Game setup
  const player = document.getElementById("player");
  const gameCanvas = document.getElementById("gameCanvas");
  const fadeOverlay = document.getElementById("fadeOverlay");
  const dialogueBox = document.getElementById("dialogueBox");
  const quizContainer = document.getElementById("quizContainer");
  const pressKeyHint = document.getElementById("pressKeyHint");

  let playerX = 368, playerY = 400;
  const moveSpeed = 10;
  let inMainRoom = true;
  let dreamTriggered = false;
  let npcs = [];
  let activeNPC = null;

  // 📦 Load NPCs dynamically from Firestore
  async function loadNPCs() {
    const snap = await getDocs(collection(db, "assessments"));
    npcs = [];
    let i = 0;
    snap.forEach(docSnap => {
      const data = docSnap.data();
      const npcEl = document.createElement("div");
      npcEl.className = "npc";
      npcEl.style.left = `${150 + (i * 200)}px`;
      npcEl.style.top = `${150 + (i % 2) * 150}px`;
      npcEl.textContent = data.title ? data.title.charAt(0).toUpperCase() : "N";
      npcEl.dataset.questId = docSnap.id;
      gameCanvas.appendChild(npcEl);
      npcs.push({ id: docSnap.id, title: data.title, element: npcEl });
      i++;
    });
  }

  // Movement controls
  document.addEventListener("keydown", (e) => {
    if (dreamTriggered || quizContainer.style.display === "flex") return;
    switch (e.key) {
      case "ArrowUp": case "w": playerY -= moveSpeed; break;
      case "ArrowDown": case "s": playerY += moveSpeed; break;
      case "ArrowLeft": case "a": playerX -= moveSpeed; break;
      case "ArrowRight": case "d": playerX += moveSpeed; break;
      case " ":
        if (inMainRoom) startDream();
        break;
      case "e": case "E":
        if (activeNPC) talkToNPC(activeNPC);
        break;
    }
    playerX = Math.max(0, Math.min(playerX, 736));
    playerY = Math.max(0, Math.min(playerY, 536));
    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
    checkProximity();
  });

  // Scene transition
  function startDream() {
    dreamTriggered = true;
    fadeOverlay.style.opacity = "1";
    showDialogue("You feel sleepy... drifting into a mathematical dream...");
    setTimeout(async () => {
      gameCanvas.style.background = "url('data/Map.png') no-repeat center/cover";
      fadeOverlay.style.opacity = "0";
      inMainRoom = false;
      dreamTriggered = false;
      await loadNPCs();
    }, 2000);
  }

  // Dialogue display
  function showDialogue(text, callback) {
    dialogueBox.style.display = "block";
    dialogueBox.textContent = "";
    let i = 0;
    const interval = setInterval(() => {
      dialogueBox.textContent += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        if (callback) setTimeout(callback, 1000);
      }
    }, 40);
    setTimeout(() => { dialogueBox.style.display = "none"; }, 4000);
  }

  // Proximity detection
  function checkProximity() {
    activeNPC = null;
    pressKeyHint.style.display = "none";
    npcs.forEach(npc => {
      const rect1 = player.getBoundingClientRect();
      const rect2 = npc.element.getBoundingClientRect();
      const dx = rect1.x - rect2.x;
      const dy = rect1.y - rect2.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 80) {
        activeNPC = npc;
        pressKeyHint.style.display = "block";
      }
    });
  }

  // Talk to NPC
  function talkToNPC(npc) {
    pressKeyHint.style.display = "none";
    showDialogue(`NPC: "${npc.title}"`, () => openQuiz(npc.id));
  }

  // 🎯 Multi-question Quiz
  async function openQuiz(questId) {
    const snap = await getDoc(doc(db, "assessments", questId));
    if (!snap.exists()) {
      showDialogue("No assessment found for this quest yet.");
      return;
    }

    const data = snap.data();
    const questions = data.questions || [];
    if (questions.length === 0) {
      showDialogue("This assessment has no questions yet.");
      return;
    }

    quizContainer.style.display = "flex";
    let current = 0;
    let score = 0;

    const renderQuestion = () => {
      const q = questions[current];
      quizContainer.innerHTML = `
        <h2>${data.title}</h2>
        <p>${q.question}</p>
        <div id="options"></div>
        <button id="submitAnswer">Submit</button>
      `;
      const optionsDiv = document.getElementById("options");
      let selectedAnswer = null;
      // ensure responses array exists to capture student's answers for each question
      window._currentQuizResponses = window._currentQuizResponses || [];
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = (e) => {
          selectedAnswer = opt;
          document.querySelectorAll("#options button").forEach(b => b.style.background = "#4a6b16");
          e.target.style.background = "#a5d6a7";
        };
        optionsDiv.appendChild(btn);
      });

      document.getElementById("submitAnswer").onclick = () => {
        if (!selectedAnswer) {
          alert("Please select an answer first!");
          return;
        }
        // record response for this question
        const isCorrect = (selectedAnswer === q.answer);
        window._currentQuizResponses.push({ question: q.question, studentAnswer: selectedAnswer, correctAnswer: q.answer, isCorrect });
        if (isCorrect) score += 100 / questions.length;
        current++;
        if (current < questions.length) renderQuestion();
        else finishQuiz(Math.round(score));
      };
    };

    // 🧩 Save to Firestore and calculate average
    const finishQuiz = async (finalScore) => {
      quizContainer.innerHTML = `<h3>Quiz Complete!</h3><p>Your total score: ${finalScore}</p>`;
      const student = JSON.parse(localStorage.getItem("studentUser"));
      if (student) {
        const userRef = doc(db, "users", student.id);
        try {
          const snapUser = await getDoc(userRef);
          const userData = snapUser.exists() ? snapUser.data() : {};

          const progress = userData.progress || {};
          const scores = userData.scores || {};

          progress[questId] = {
            title: data.title,
            score: finalScore,
            status: "Completed",
            completedAt: new Date().toISOString(),
            questions: window._currentQuizResponses || []
          };

          // Match quest to topic key for reports
          let topicKey = "";
          if (questId === "quest_1") topicKey = "timelessVillage";
          else if (questId === "quest_2") topicKey = "gmdasOperations";
          else if (questId === "quest_3") topicKey = "multiplyingFractions";
          else if (questId === "quest_4") topicKey = "areaOfShapes";
          else topicKey = questId;

          scores[topicKey] = finalScore;

          await updateDoc(userRef, { progress, scores });

          // read back to confirm saved
          const confirmSnap = await getDoc(userRef);
          console.log('Saved user progress for', student.id, confirmSnap.exists() ? confirmSnap.data().progress?.[questId] : null);

          // reset temp responses
          window._currentQuizResponses = [];

          // show brief confirmation in the quiz container
          const savedMsg = document.createElement('div');
          savedMsg.style.marginTop = '12px';
          savedMsg.style.padding = '8px';
          savedMsg.style.background = '#e6f4e6';
          savedMsg.style.color = '#265a16';
          savedMsg.style.borderRadius = '8px';
          savedMsg.textContent = 'Progress saved to server.';
          quizContainer.appendChild(savedMsg);
        } catch (err) {
          console.error('Failed saving progress', err);
          alert('There was an error saving your progress. Check the console for details.');
        }
      }
      setTimeout(() => {
        quizContainer.style.display = "none";
        showDialogue("Well done! Keep exploring the world of Math!");
      }, 2500);
    };

    renderQuestion();
  }
  </script>
</body>
</html>
