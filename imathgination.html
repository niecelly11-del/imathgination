<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iMATHgination Web Portal</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6b8e23;
      --primary-dark: #4c6a1a;
      --bg: #dfe6cf;
      --bg-card: #b6c28f;
      --bg-frame: #8fa36b;
      --text: #2b2b2b;
      --accent: #e6e3cc;
      --font-main: "Inter", sans-serif;
      --font-soft: "Nunito", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      border: 10px solid var(--bg-frame);
      background-image: linear-gradient(to bottom, #e7edd5 0%, #dfe6cf 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.15);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.8rem;
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--bg-frame);
    }
    .logo-right img, .logo img { width: 60px; height: 60px; object-fit: contain; }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo h1 { font-family: var(--font-soft); font-size: 1.3rem; font-weight: 700; color: var(--primary-dark); }
    .hero { text-align: center; padding: 3rem 1rem; background: linear-gradient(to bottom, #dee6d1, #d1dbb9); border-radius: 0 0 2rem 2rem; width: 100%; }
    .hero h2 { font-family: var(--font-soft); font-size: 2.3rem; font-weight: 700; color: var(--primary-dark); }

    .login-card {
      background: var(--accent);
      border-radius: 1rem;
      border: 1px solid var(--bg-frame);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      width: 320px;
      margin-top: 3rem;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .input-group { text-align: left; margin-bottom: 1rem; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: var(--primary-dark); }
    .input-group input {
      width: 100%; padding: 0.75rem;
      border-radius: 0.5rem; border: 1px solid #ccc;
      font-size: 1rem; font-family: var(--font-main);
    }
    .btn {
      background: var(--primary); color: white; border: none;
      border-radius: 0.5rem; padding: 0.85rem; width: 100%;
      font-size: 1rem; cursor: pointer;
      transition: background 0.3s ease;
      font-family: var(--font-soft); font-weight: 600; margin-top: 0.3rem;
    }
    .btn:hover { background: var(--primary-dark); }
    .link-btn {
      background: none; border: none;
      color: var(--primary-dark);
      font-size: 0.9rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 0.75rem;
    }
    footer { background-color: var(--bg-card); border-top: 2px solid var(--bg-frame); text-align: center; padding: 1rem; width: 100%; margin-top: auto; }

    /* === Forgot Password Modal === */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    .modal-content {
      background: var(--accent);
      border-radius: 1rem;
      border: 2px solid var(--bg-frame);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 380px;
      padding: 2rem 1.5rem;
      text-align: center;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content h3 {
      font-family: var(--font-soft);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 1.5rem;
    }

    .modal-content input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      font-size: 1rem;
      font-family: var(--font-main);
    }

    .close-btn {
      background: #ccc;
      color: #333;
      border: none;
      border-radius: 0.5rem;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      margin-top: 0.8rem;
    }

    .close-btn:hover {
      background: #aaa;
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="assets/LogoApp1.png" alt="Logo Left">
      <h1>iMATHgination</h1>
    </div>
    <div class="logo-right">
      <img src="assets/ProbexLogo.png" alt="Logo Right">
    </div>
  </header>

  <section class="hero">
    <h2>Welcome to iMATHgination Portal</h2>
  </section>

  <div class="login-card">
    <h3>Login</h3>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username or number">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>
    <button class="btn" onclick="login()">Login</button>
    <button class="link-btn" onclick="showForgotPassword()">Forgot Password?</button>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal" id="forgotPasswordModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Forgot Password</h3>

      <!-- Request OTP -->
      <div id="step1">
        <input id="teacherNumber" type="text" placeholder="Enter your Teacher Number">
        <button class="btn" onclick="sendOTP()">Send OTP</button>
      </div>

      <!-- Verify OTP -->
      <div id="step2" style="display:none;">
        <input id="otpInput" type="text" placeholder="Enter OTP">
        <input id="newPassword" type="password" placeholder="Enter New Password">
        <input id="confirmPassword" type="password" placeholder="Confirm New Password">
        <button class="btn" onclick="verifyOTP()">Verify & Reset</button>
      </div>

      <button class="close-btn" onclick="closeForgotPassword()">Cancel</button>
    </div>
  </div>

  <footer>
    <p>© 2025 iMATHgination — All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADVdmyzhrewkr2-AjV15NwdAqrfhw2TaY",
      authDomain: "imathgination-7e610.firebaseapp.com",
      projectId: "imathgination-7e610",
      storageBucket: "imathgination-7e610.appspot.com",
      messagingSenderId: "591589679937",
      appId: "1:591589679937:web:5298f062812021e64c77c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    emailjs.init("kPi88fnY7COIn_BMB");

    let generatedOTP = null;
    let teacherDocId = null;
    let teacherEmail = null;

    window.showForgotPassword = () => document.getElementById("forgotPasswordModal").style.display = "flex";
    window.closeForgotPassword = () => {
      document.getElementById("forgotPasswordModal").style.display = "none";
      document.getElementById("step1").style.display = "block";
      document.getElementById("step2").style.display = "none";
    };

    // Close modal when clicking outside
    document.getElementById("forgotPasswordModal").addEventListener("click", (e) => {
      if (e.target.id === "forgotPasswordModal") closeForgotPassword();
    });

    window.sendOTP = async () => {
      const teacherNumber = document.getElementById("teacherNumber").value.trim();
      if (!teacherNumber) return alert("Please enter your Teacher Number.");

      try {
        const q = query(collection(db, "users"), where("number", "==", teacherNumber));
        const snapshot = await getDocs(q);

        if (snapshot.empty) return alert("Teacher record not found.");

        const docSnap = snapshot.docs[0];
        const userData = docSnap.data();
        teacherDocId = docSnap.id;
        teacherEmail = userData.email?.trim() || "";

        if (!teacherEmail) return alert("No email found for this user.");

        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

        const params = {
          to_email: teacherEmail,
          from_name: "iMATHgination Support",
          message: `Your OTP code is ${generatedOTP}. It will expire in 5 minutes.`,
        };

        await emailjs.send("service_ns7yijr", "template_p8id428", params);
        alert(`OTP sent to ${teacherEmail}`);
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";

      } catch (error) {
        console.error("EmailJS Error:", error);
        alert(` Failed to send OTP. ${error.text || error.message}`);
      }
    };

    window.verifyOTP = async () => {
      const otpInput = document.getElementById("otpInput").value.trim();
      const newPass = document.getElementById("newPassword").value.trim();
      const confirmPass = document.getElementById("confirmPassword").value.trim();

      if (otpInput !== generatedOTP) return alert("Invalid OTP.");
      if (newPass !== confirmPass) return alert("Passwords do not match.");

      const ref = doc(db, "users", teacherDocId);
      await updateDoc(ref, { password: newPass });

      alert("Password updated successfully!");
      closeForgotPassword();
    };

    window.login = async () => {
      const usernameOrNumber = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!usernameOrNumber || !password) return alert("Enter both fields.");

      try {
        const usersRef = collection(db, "users");

        // Query by credentials (regardless of active value), then check active in JS
        const q1 = query(usersRef, where("username", "==", usernameOrNumber), where("password", "==", password));
        const q2 = query(usersRef, where("number", "==", usernameOrNumber), where("password", "==", password));

        const [snapshot1, snapshot2] = await Promise.all([getDocs(q1), getDocs(q2)]);
        const snapshot = !snapshot1.empty ? snapshot1 : snapshot2;

        if (snapshot.empty) return alert("Invalid credentials.");

        const userDoc = snapshot.docs[0];
        const userData = userDoc.data();
        // only block when active is explicitly false; treat missing/other truthy values as active
        if (userData.active === false) {
          alert("Your account is inactive. Please contact the administrator.");
          return;
        }

        const sessionData = {
          role: userData.role || "teacher",
          number: userData.number || "",
          username: userData.username || "",
          first: userData.first || "",
          last: userData.last || "",
          email: userData.email || "",
        };
        localStorage.setItem("session", JSON.stringify(sessionData));

  // silently continue to dashboard without showing an alert
  window.location.href = userData.role === "superadmin" ? "admin.html" : "teacher.html";

      } catch (error) {
        console.error("Login error:", error);
        alert("An error occurred during login.");
      }
    };

    // Allow pressing Enter in username/password fields to submit the login
    try {
      const userInput = document.getElementById('username');
      const passInput = document.getElementById('password');
      const enterHandler = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          // small debounce: blur then call login to avoid double submissions
          try { e.target.blur(); } catch (er) {}
          window.login();
        }
      };
      if (userInput) userInput.addEventListener('keydown', enterHandler);
      if (passInput) passInput.addEventListener('keydown', enterHandler);
    } catch (e) { console.warn('Enter-key login wiring failed', e); }
  </script>
</body>
</html>
