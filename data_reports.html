<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Reports | iMATHgination</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b8e23;
      --primary-dark: #4c6a1a;
      --bg: #dfe6cf;
      --bg-card: #b6c28f;
      --bg-frame: #8fa36b;
      --text: #2b2b2b;
      --accent: #e6e3cc;
      --font-main: "Inter", sans-serif;
      --font-soft: "Nunito", sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      border: 10px solid var(--bg-frame);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.15);
      background-image: linear-gradient(to bottom, #e7edd5 0%, #dfe6cf 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 97.4vh;
    }

    header {
      background: var(--bg-card);
      color: var(--primary-dark);
      padding: 20px 245.9px;
      display: flex;
      justify-content: center;
      align-items: center;
      position:relative;
      width: 100%;
      max-width: 1000px;
      border-bottom: 2px solid var(--bg-frame);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-family: var(--font-soft);
      font-weight: 700;
      text-align: center;
      flex-grow: 1;
    }
#analyticsBtn,
#wrongBtn {
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 8px 18px;
  font-family: var(--font-soft);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 3px 6px rgba(76,106,26,0.25);
}

#analyticsBtn:hover,
#wrongBtn:hover {
  transform: scale(1.05);
  background: linear-gradient(90deg, var(--primary-dark) 0%, var(--primary) 100%);
  box-shadow: 0 4px 10px rgba(76,106,26,0.35);
}


/* --- Close / Cancel Buttons --- */
.close-btn {
  background-color: var(--accent);
  color: var(--primary-dark);
  border: 1px solid var(--bg-frame);
  border-radius: 0.5rem;
  padding: 0.6rem 1.2rem;
  font-weight: 600;
  transition: all 0.3s ease;
}

.close-btn:hover {
  background-color: var(--primary-dark);
  color: white;
  transform: scale(1.05);
}

    .back-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      background: var(--accent);
      color: var(--primary-dark);
      border: 1px solid var(--bg-frame);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font-soft);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    /* Modal styling (minimal) */
    .modal { display: none; 
      position: fixed; z-index: 100; 
      left: 0; top: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.5); 
      justify-content: center; align-items: center; }
    .modal-content { 
      background: var(--accent); padding: 
      20px; border-radius: 12px; width: 90%; 
      max-width: 900px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }

    main {
      flex: 1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 900px;
    }

    h2 {
      color: var(--primary-dark);
      font-family: var(--font-soft);
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    p {
      color: #3d3d3d;
      font-size: 0.95rem;
      margin-bottom: 25px;
      text-align: center;
      max-width: 700px;
    }

    .filter-label {
      text-align: center;
      font-family: var(--font-soft);
      color: var(--primary-dark);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .section-buttons, .tab-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-btn, .tab-btn {
      background: transparent;
      border: 1.5px solid rgba(76,106,26,0.25);
      border-radius: 999px;
      padding: 10px 22px;
      font-family: var(--font-soft);
      font-weight: 700;
      color: var(--primary-dark);
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: none;
    }

    .section-btn.active, .tab-btn.active {
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 8px rgba(76,106,26,0.12);
    }

    /* topic tabs container used in Wrong Answers modal */
    #wrongTopicTabs {
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    }

    /* ✨ Compact Search Bar */
    .search-box {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 25px auto;
    }

    .search-box input {
      width: 100%;
      height: 38px;
      border-radius: 14px;
      border: 2px solid var(--bg-frame);
      background-color: var(--accent);
      font-family: var(--font-soft);
      font-size: 0.9rem;
      color: var(--primary-dark);
      padding: 0 38px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input::placeholder {
      color: #6c7a4a;
    }

    .search-box input:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(107,142,35,0.2);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--primary-dark);
      opacity: 0.8;
    }

    .table-card {
      background: var(--accent);
      border: 1px solid var(--bg-frame);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 750px;
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-soft);
      font-size: 0.95rem;
      margin: 0 auto;
    }

    th, td {
      border-bottom: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: var(--bg-card);
      color: var(--primary-dark);
    }

    tr:hover {
      background-color: #f4f4f4;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease-in; }

  /* Modal header and close button for consistent design */
  .modal-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .modal-header h3 { margin:0; font-size:1.1rem; color:var(--primary-dark); font-family:var(--font-soft); }
  .modal-close { background:transparent; border:1px solid rgba(0,0,0,0.06); padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:700; }
  .modal-close:hover { background:rgba(0,0,0,0.03); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

     .points-badge {
       display:inline-block;
       background: var(--primary);
       color: #fff;
       font-weight:700;
       padding: 4px 8px;
       border-radius: 12px;
       font-size: 0.85rem;
       vertical-align: middle;
       margin-left: 8px;
     }
     .q-preview { background: rgba(142,169,105,0.06); padding:10px; border-radius:8px; margin-bottom:6px; }
     .q-edit { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  </style>
</head>

<body>
  <header>
    <h1>Data Reports</h1>
    <div style="display:flex; gap:10px;">
      <button id="analyticsBtn">Analytics</button>
      <button id="wrongBtn">Wrong Answers</button>
      <button id="exportPdfBtn" class="section-btn" style="background:transparent;">Export PDFs</button>
    </div>
    <button id="backBtn" class="back-btn">Back to Dashboard</button>
  </header>
  <main>
    <h2>Student Performance</h2>
    <p>Select a topic tab and use the section filter or search to view student scores.</p>

    <!-- Dashboard cards moved into Analytics modal to keep the main page focused -->

    <div class="filter-label">Section:</div>
    <div class="section-buttons" id="sectionButtons"></div>

    <!-- search box removed per request -->

    <div class="tab-buttons" id="topicTabs"></div>
    <div id="tabContents"></div>
  </main>

    <!-- Replace inline scripts with external module -->
    <script type="module" src="./data_reports.js"></script>
    </body>
    </html>
